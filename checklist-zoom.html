<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checklist materiale tecnico Zoom</title>
<style>
  :root {
    --bg: #eef1f4;
    --card: #ffffff;
    --ink: #1c2530;
    --muted: #5d6b7a;
    --line: #d5dbe2;
    --accent: #1f4e79;
    --accent-soft: #e3edf6;
    --yes: #1f7a4d;
    --no: #8a94a0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    line-height: 1.45;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: .95rem; }
  h2 { font-size: 1.15rem; margin: 0 0 12px; letter-spacing: .02em; }
  .panel {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 8px; padding: 16px; margin-bottom: 20px;
  }

  /* Dati evento */
  .campi { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .campo { display: flex; flex-direction: column; gap: 4px; }
  .campo.largo { grid-column: 1 / -1; }
  .campo label { font-weight: 600; font-size: .92rem; }
  .campo input {
    font: inherit; padding: 10px 12px; min-height: 46px;
    border: 2px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink);
  }
  .campo input:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .riepilogo { margin: 0 0 14px; padding-bottom: 12px; border-bottom: 2px solid var(--line); }
  .riepilogo[hidden] { display: none; }
  .riepilogo .r-nome { font-size: 1.25rem; font-weight: 700; margin: 0; }
  .riepilogo .r-info { margin: 2px 0 0; color: var(--muted); }

  /* Domande */
  .q { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .q[hidden] { display: none; }
  .q.dipende { margin-left: 12px; padding-left: 14px; border-left: 4px solid var(--accent-soft); }
  .q-text { margin: 0 0 4px; font-weight: 600; }
  .q-help { margin: 0 0 10px; color: var(--muted); font-size: .88rem; }
  .choices { display: flex; gap: 10px; }
  .choice { position: relative; flex: 0 0 auto; }
  .choice input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .choice span {
    display: block; min-width: 84px; text-align: center; padding: 10px 18px;
    border: 2px solid var(--line); border-radius: 6px; font-weight: 700;
    color: var(--no); background: #fff; user-select: none;
  }
  .choice input:checked + span.si { background: var(--yes); border-color: var(--yes); color: #fff; }
  .choice input:checked + span.no { background: #4a5663; border-color: #4a5663; color: #fff; }
  .choice input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* Tabella */
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
  th { font-size: .85rem; color: var(--muted); font-weight: 600; }
  td.qty, th.qty { width: 80px; text-align: center; font-weight: 700; }
  .empty { color: var(--muted); padding: 14px 8px; }

  .zoom {
    margin-top: 16px; padding: 12px 14px; border-radius: 6px;
    background: var(--accent-soft); border-left: 5px solid var(--accent);
  }
  .zoom small { display: block; color: var(--muted); }
  .zoom strong { font-size: 1.1rem; color: var(--accent); }

  /* Pulsanti */
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  button {
    font: inherit; font-weight: 700; padding: 12px 20px; border-radius: 6px;
    border: 2px solid var(--accent); cursor: pointer; min-height: 46px;
  }
  button.primary { background: var(--accent); color: #fff; }
  button.secondary { background: #fff; color: var(--accent); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  @media (max-width: 520px) {
    .campi { grid-template-columns: 1fr; }
    .choices { gap: 8px; }
    .choice { flex: 1; }
    button { flex: 1; }
  }

  @media print {
    body { background: #fff; }
    .wrap { padding: 0; max-width: none; }
    #datiEvento, #domande, .actions { display: none; }
    .panel { border: 0; padding: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Checklist materiale tecnico Zoom</h1>
  <p class="sub">Rispondi SÌ o NO a ogni domanda: la lista del materiale si aggiorna da sola.</p>

  <section class="panel" id="datiEvento">
    <h2>DATI EVENTO</h2>
    <div class="campi">
      <div class="campo largo">
        <label for="nomeEvento">Nome evento</label>
        <input type="text" id="nomeEvento" autocomplete="off">
      </div>
      <div class="campo">
        <label for="dataEvento">Data</label>
        <input type="date" id="dataEvento">
      </div>
      <div class="campo">
        <label for="luogoEvento">Luogo</label>
        <input type="text" id="luogoEvento" autocomplete="off">
      </div>
    </div>
  </section>

  <section class="panel" id="domande"></section>

  <section class="panel" id="risultato">
    <div class="riepilogo" id="riepilogo" hidden>
      <p class="r-nome" id="rNome"></p>
      <p class="r-info" id="rInfo"></p>
    </div>
    <h2>MATERIALE NECESSARIO</h2>
    <table>
      <thead>
        <tr><th class="qty">Quantità</th><th>Nome materiale</th></tr>
      </thead>
      <tbody id="lista"></tbody>
    </table>
    <div class="zoom" id="zoom"></div>
    <div class="actions">
      <button class="primary" id="btnStampa" type="button">STAMPA LISTA</button>
      <button class="secondary" id="btnReset" type="button">AZZERA TUTTO</button>
    </div>
  </section>
</div>

<script>
/* ==========================================================
   CONFIGURAZIONE
   Il codice sotto (LOGICA) non va modificato: per aggiungere
   domande o materiali basta intervenire solo qui.
   ========================================================== */

/* Funzioni di comodo per scrivere le condizioni */
const SI = id => risposte[id] === "si";
const NO = id => risposte[id] === "no";

/* DOMANDE: ogni domanda ha una risposta SÌ/NO.
   - aiuto:    frase breve di spiegazione sotto la domanda
   - mostraSe: (facoltativo) la domanda compare solo quando la
               condizione è vera. Le risposte delle domande
               nascoste vengono ignorate e cancellate. */
const DOMANDE = [
  {
    id: "remoto-in-sala",
    testo: "Qualcuno parlerà da remoto con Zoom e le persone in sala dovranno vederlo su uno schermo?",
    aiuto: "Esempio: un relatore che interviene da casa o da un altro ufficio."
  },
  {
    id: "remoto-vede-sala",
    testo: "Questo relatore da remoto deve anche vedere la sala?",
    aiuto: "SÌ = vede la sala in diretta. NO = non vede la sala.",
    mostraSe: () => SI("remoto-in-sala")
  },
  {
    id: "streaming-sala",
    testo: "Le persone collegate da remoto devono vedere la sala in diretta su Zoom?",
    aiuto: "Esempio: trasmettere l'evento in streaming per chi lo segue da casa. Nessun relatore parla da remoto.",
    mostraSe: () => NO("remoto-in-sala")
  },
  {
    id: "registrazione",
    testo: "Bisogna registrare l'evento?",
    aiuto: "Rispondi SÌ solo se serve una registrazione video da conservare."
  },
  {
    id: "durata-zoom",
    testo: "La riunione Zoom durerà più di 40 minuti?",
    aiuto: "Se dura 40 minuti o meno, rispondi NO."
  }
];

/* REGOLE DEL MATERIALE: quando la condizione è vera, il materiale
   viene aggiunto. Se lo stesso articolo compare in più regole,
   viene mantenuta la quantità maggiore (nessun duplicato). */
const REGOLE = [
  {
    // Relatore remoto visto in sala, che NON vede la sala
    quando: () => SI("remoto-in-sala") && NO("remoto-vede-sala"),
    materiale: [
      { nome: "PC per Zoom", qta: 1 },
      { nome: "ATEM MINI", qta: 1 },
      { nome: "SCHEDA AUDIO", qta: 1 }
    ]
  },
  {
    // Streaming della sala, senza relatore remoto
    quando: () => NO("remoto-in-sala") && SI("streaming-sala"),
    materiale: [
      { nome: "Telecamera PTZ", qta: 1 },
      { nome: "Controllo camera PTZ", qta: 1 },
      { nome: "PC per Zoom", qta: 1 },
      { nome: "ATEM MINI", qta: 1 },
      { nome: "SCHEDA AUDIO", qta: 1 }
    ]
  },
  {
    // Relatore remoto visto in sala che vede anche la sala
    quando: () => SI("remoto-in-sala") && SI("remoto-vede-sala"),
    materiale: [
      { nome: "Telecamera PTZ", qta: 1 },
      { nome: "Controllo camera PTZ", qta: 1 },
      { nome: "PC per Zoom", qta: 1 },
      { nome: "ATEM MINI", qta: 1 },
      { nome: "SCHEDA AUDIO", qta: 2 }
    ]
  },
  {
    // Registrazione (si può combinare con qualsiasi configurazione)
    quando: () => SI("registrazione"),
    materiale: [
      { nome: "Telecamera PTZ", qta: 1 },
      { nome: "Controllo camera PTZ", qta: 1 },
      { nome: "ATEM MINI", qta: 1 },
      { nome: "HARD DISK", qta: 1 }
    ]
  }
];

/* PIANO ZOOM: mostrato separatamente dalla lista del materiale */
const PIANI = [
  { quando: () => NO("durata-zoom"), nome: "Piano Zoom STANDARD" },
  { quando: () => SI("durata-zoom"), nome: "Piano Zoom PRO" }
];

/* ==========================================================
   LOGICA
   ========================================================== */
let risposte = {};            // id domanda -> "si" | "no"

const elDomande = document.getElementById("domande");
const elLista = document.getElementById("lista");
const elZoom = document.getElementById("zoom");
const campiEvento = ["nomeEvento", "dataEvento", "luogoEvento"].map(id => document.getElementById(id));

/* Riepilogo evento (nome, data, luogo): compare sopra la lista e nella stampa */
function disegnaRiepilogo() {
  const [nome, data, luogo] = campiEvento.map(el => el.value.trim());
  let dataIt = "";
  if (data) { const [a, m, g] = data.split("-"); dataIt = `${g}/${m}/${a}`; }
  const info = [dataIt && "Data: " + dataIt, luogo && "Luogo: " + luogo].filter(Boolean).join("   |   ");
  document.getElementById("rNome").textContent = nome;
  document.getElementById("rNome").hidden = !nome;
  document.getElementById("rInfo").textContent = info;
  document.getElementById("rInfo").hidden = !info;
  document.getElementById("riepilogo").hidden = !(nome || info);
}
campiEvento.forEach(el => el.addEventListener("input", disegnaRiepilogo));

function costruisciDomande() {
  DOMANDE.forEach(d => {
    const box = document.createElement("div");
    box.className = "q" + (d.mostraSe ? " dipende" : "");
    box.id = "q-" + d.id;
    box.innerHTML =
      `<p class="q-text"><span class="num"></span>${d.testo}</p>` +
      `<p class="q-help">${d.aiuto || ""}</p>` +
      `<div class="choices" role="radiogroup" aria-label="${d.testo}">` +
      `<label class="choice"><input type="radio" name="${d.id}" value="si"><span class="si">SÌ</span></label>` +
      `<label class="choice"><input type="radio" name="${d.id}" value="no"><span class="no">NO</span></label>` +
      `</div>`;
    box.querySelectorAll("input").forEach(inp =>
      inp.addEventListener("change", () => { risposte[d.id] = inp.value; aggiorna(); })
    );
    elDomande.appendChild(box);
  });
}

const visibile = d => !d.mostraSe || d.mostraSe();

/* Cancella le risposte delle domande che non sono più visibili */
function pulisciNascoste() {
  let cambiato = true;
  while (cambiato) {
    cambiato = false;
    DOMANDE.forEach(d => {
      if (!visibile(d) && risposte[d.id]) { delete risposte[d.id]; cambiato = true; }
    });
  }
}

function aggiornaDomande() {
  let n = 0;
  DOMANDE.forEach(d => {
    const box = document.getElementById("q-" + d.id);
    const vis = visibile(d);
    box.hidden = !vis;
    if (vis) { n++; box.querySelector(".num").textContent = n + ". "; }
    box.querySelectorAll("input").forEach(inp => { inp.checked = risposte[d.id] === inp.value; });
  });
}

/* Unisce i materiali: nessun duplicato, vale la quantità maggiore */
function calcolaMateriale() {
  const totale = new Map();
  REGOLE.forEach(r => {
    if (!r.quando()) return;
    r.materiale.forEach(m => totale.set(m.nome, Math.max(totale.get(m.nome) || 0, m.qta)));
  });
  return totale;
}

function disegnaLista() {
  const materiale = calcolaMateriale();
  elLista.innerHTML = "";
  if (materiale.size === 0) {
    elLista.innerHTML = '<tr><td colspan="2" class="empty">Nessun materiale selezionato. Rispondi SÌ a una domanda per iniziare.</td></tr>';
    return;
  }
  materiale.forEach((qta, nome) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td class="qty">${qta}</td><td class="name"></td>`;
    tr.querySelector(".name").textContent = nome;
    elLista.appendChild(tr);
  });
}

function disegnaPiano() {
  const p = PIANI.find(x => x.quando());
  elZoom.innerHTML = `<small>Piano Zoom necessario</small><strong>${p ? p.nome : "—"}</strong>`;
}

function aggiorna() {
  pulisciNascoste();
  aggiornaDomande();
  disegnaLista();
  disegnaPiano();
}

function azzera() {
  risposte = {};
  campiEvento.forEach(el => { el.value = ""; });
  disegnaRiepilogo();
  aggiorna();
}

document.getElementById("btnReset").addEventListener("click", azzera);
document.getElementById("btnStampa").addEventListener("click", () => window.print());

costruisciDomande();
aggiorna();
disegnaRiepilogo();
</script>
</body>
</html>
